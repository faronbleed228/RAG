[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25>=0.3.13",
    "fire>=0.7.1",
    "llvmlite==0.44.0",
    "numba==0.61.2",
    "numpy<2",
    "pathlib>=1.0.1",
    "pydantic>=2.13.5",
    "pystemmer>=3.1.0",
    "pytest>=9.1.1",
    "regex>=2026.9.29",
    "torch==2.2.2",
    "tqdm>=4.70.1",
    "transformers==4.51.3",
    "types-regex>=2026.9.29.20261005",
    "types-tqdm>=4.70.0.20260906",
    "uuid>=1.30",
]

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*", "fire", "fire.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "flake8==7.4.1",
    "mypy==2.4.0",
]
